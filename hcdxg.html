<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16213e">
<title>合成大西瓜 · HTML5 休闲小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1a2a4f 0%, #16213e 45%, #0f3460 100%);
    background-attachment: fixed;
    color: #fff; overflow: hidden; overscroll-behavior: none;
    touch-action: manipulation;
  }
  /* ===== 整页按视口布局：画布永远完整可见 ===== */
  #app {
    height: 100vh; height: 100dvh;
    width: 100%; max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 10px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  header { flex: 0 0 auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  h1 {
    font-size: clamp(18px, 5.2vw, 26px); letter-spacing: 2px; line-height: 1.25;
    text-shadow: 0 2px 8px rgba(0,0,0,.45);
    background: linear-gradient(90deg, #ffd166, #ff6b6b, #c084fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-size: 12px; color: #9db4d8; text-align: center; }
  .hud { display: flex; gap: 8px; align-items: center; }
  .card {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px; padding: 5px 15px; text-align: center;
    backdrop-filter: blur(4px);
  }
  .card .label { font-size: 11px; color: #9db4d8; }
  .card .val { font-size: 19px; font-weight: 700; color: #ffd166; line-height: 1.2; }

  /* 画布容器：占满剩余空间，居中，绝不溢出 */
  #stageWrap {
    flex: 1 1 auto; min-height: 0; align-self: stretch;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #stage {
    position: relative; border-radius: 16px; overflow: hidden; touch-action: none;
    box-shadow: 0 12px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  canvas { display: block; }

  #overlay {
    position: absolute; inset: 0; display: none;
    background: rgba(10, 16, 32, .82); backdrop-filter: blur(3px);
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    z-index: 10; padding: 12px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: clamp(20px, 7vw, 30px); color: #ff6b6b; letter-spacing: 4px; }
  #overlay .final { font-size: clamp(12px, 3.6vw, 16px); color: #cfe0ff; text-align: center; }
  #overlay .final b { color: #ffd166; font-size: clamp(18px, 6vw, 26px); }
  #overlay button {
    margin-top: 4px; padding: clamp(9px, 2.6vw, 12px) clamp(26px, 10vw, 42px);
    font-size: clamp(14px, 4vw, 17px); font-weight: 700;
    color: #fff; border: none; border-radius: 999px; cursor: pointer; letter-spacing: 2px;
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    box-shadow: 0 6px 18px rgba(255,107,107,.4);
    transition: transform .15s;
  }
  #overlay button:hover { transform: scale(1.06); }

  footer { flex: 0 0 auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  /* 进化链：单行不换行，窄屏可横向滑动，不占额外高度 */
  .chain {
    width: 100%; display: flex; flex-wrap: nowrap; align-items: center;
    gap: 5px; justify-content: center;
    overflow-x: auto; overflow-y: hidden; padding: 2px 4px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .chain::-webkit-scrollbar { display: none; }
  .chain .step {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: rgba(255,255,255,.06); border-radius: 10px; padding: 4px 9px;
    min-width: 46px; border: 1px solid rgba(255,255,255,.08);
  }
  .chain .step .e { font-size: 18px; line-height: 1.15; }
  .chain .step .n { font-size: 10px; color: #9db4d8; white-space: nowrap; }
  .chain .arrow { flex: 0 0 auto; color: #5f7ab0; font-size: 12px; }
  .tips { font-size: 11px; color: #7d92b8; text-align: center; line-height: 1.6; }

  /* ===== 高度不足时逐级收起次要信息，优先保证游戏区 ===== */
  @media (max-height: 660px) { .tips { display: none; } }
  @media (max-height: 600px) { .sub  { display: none; } }
  @media (max-height: 540px) { .chain { display: none; } }
  @media (max-width: 620px) { .chain { justify-content: flex-start; } }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>🍉 合成大西瓜</h1>
    <div class="sub">两个相同的水果碰撞 → 合成更大的水果</div>
    <div class="hud">
      <div class="card"><div class="label">分数</div><div class="val" id="score">0</div></div>
      <div class="card"><div class="label">最高分</div><div class="val" id="best">0</div></div>
      <div class="card"><div class="label">下一个</div><div class="val" id="next" style="font-size:21px">🍇</div></div>
    </div>
  </header>

  <div id="stageWrap">
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="overlay">
        <h2>游戏结束</h2>
        <div class="final">本局得分 <b id="finalScore">0</b></div>
        <div class="final" id="finalFruit"></div>
        <button id="restart">再来一局</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="chain" id="chain"></div>
    <div class="tips">
      🖱️ 移动鼠标/手指瞄准 · 点击/松开投放 · ⌨️ ←→ 移动 · 空格投下<br>
      水果堆过红色警戒线即告失败 · 合成两个 🍉 大西瓜即达成终极目标！
    </div>
  </footer>
</div>

<script>
(() => {
'use strict';

/* ==================== 水果进化链（精简为 8 级） ==================== */
const FRUITS = [
  { name:'葡萄',   emoji:'🍇', r:15, score:1  },
  { name:'樱桃',   emoji:'🍒', r:21, score:3  },
  { name:'橘子',   emoji:'🍊', r:28, score:6  },
  { name:'柠檬',   emoji:'🍋', r:36, score:10 },
  { name:'猕猴桃', emoji:'🥝', r:46, score:16 },
  { name:'菠萝',   emoji:'🍍', r:58, score:24 },
  { name:'椰子',   emoji:'🥥', r:73, score:36 },
  { name:'大西瓜', emoji:'🍉', r:95, score:55 },
];
const MAX_LEVEL = FRUITS.length - 1;
const COLORS = ['#a78bfa','#f87171','#fb923c','#facc15','#84cc16','#f59e0b','#a3e635','#22c55e'];
const SPAWN_W = [34, 30, 22, 14];      // 只投放前 4 级（葡萄~柠檬）

/* ==================== 画布与自适应尺寸 ==================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 400, H = 640;                // 逻辑坐标系：游戏逻辑永远按这套算
const stageEl = document.getElementById('stage');
const stageWrap = document.getElementById('stageWrap');
let cssW = W, cssH = H;

function fitCanvas() {
  let availW = stageWrap.clientWidth;
  let availH = stageWrap.clientHeight;
  if (!(availW > 40) || !(availH > 40)) {          // 布局还没就绪时的兜底
    availW = Math.max(220, Math.min(window.innerWidth - 20, W));
    availH = Math.max(320, window.innerHeight * 0.62);
  }
  let w = availW, h = w * H / W;
  if (h > availH) { h = availH; w = h * W / H; }    // 等比缩放，保证完整可见
  cssW = Math.max(140, Math.floor(w));
  cssH = Math.floor(cssW * H / W);

  stageEl.style.width  = cssW + 'px';
  stageEl.style.height = cssH + 'px';
  canvas.style.width   = cssW + 'px';
  canvas.style.height  = cssH + 'px';

  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}

const WALL_L = 0, WALL_R = W, FLOOR = H - 8;
const DANGER_Y = 120;            // 警戒线
const SPAWN_Y = 62;              // 投放高度

/* ==================== 游戏状态 ==================== */
let fruits = [];                 // {x,y,vx,vy,r,level,id,age,overT,pop}
let score = 0;
let best = +(localStorage.getItem('dw_best') || 0);
let currentLevel = 0, nextLevel = 0;
let aimX = W / 2;
let canDrop = true, dropCooldown = 0;
let gameOver = false;
let particles = [], popups = [];
let uid = 0;
let winFlash = 0;

const $score = document.getElementById('score');
const $best  = document.getElementById('best');
const $next  = document.getElementById('next');
const $overlay = document.getElementById('overlay');
const $finalScore = document.getElementById('finalScore');
const $finalFruit = document.getElementById('finalFruit');

/* ==================== 进化链 UI ==================== */
const chainEl = document.getElementById('chain');
FRUITS.forEach((f, i) => {
  if (i > 0) {
    const a = document.createElement('div');
    a.className = 'arrow'; a.textContent = '›';
    chainEl.appendChild(a);
  }
  const s = document.createElement('div');
  s.className = 'step';
  s.innerHTML = `<div class="e">${f.emoji}</div><div class="n">${f.name}</div>`;
  chainEl.appendChild(s);
});

/* ==================== 音效（WebAudio） ==================== */
let audioCtx = null;
function playPop(level) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(300 + level * 65, t);
    o.frequency.exponentialRampToValueAtTime(600 + level * 95, t + 0.08);
    g.gain.setValueAtTime(0.22, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.2);
  } catch (e) {}
}

/* ==================== 工具 ==================== */
const rand = (a, b) => a + Math.random() * (b - a);
function randSpawnLevel() {
  const total = SPAWN_W.reduce((a, b) => a + b, 0);
  let s = Math.random() * total, acc = 0;
  for (let i = 0; i < SPAWN_W.length; i++) { acc += SPAWN_W[i]; if (s < acc) return i; }
  return 0;
}
function makeFruit(level, x, y, vx = 0, vy = 0) {
  return { x, y, vx, vy, r: FRUITS[level].r, level, id: ++uid, age: 0, overT: 0, pop: 0 };
}

/* ==================== 输入（坐标换算已兼容画布缩放） ==================== */
function pointerX(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches && e.touches.length ? e.touches[0] : null;
  const cx = t ? t.clientX : e.clientX;
  return (cx - rect.left) / rect.width * W;
}
function clampAim() {
  const r = FRUITS[currentLevel].r;
  aimX = Math.max(WALL_L + r + 2, Math.min(WALL_R - r - 2, aimX));
}
canvas.addEventListener('mousemove', e => { if (gameOver) return; aimX = pointerX(e); clampAim(); });
canvas.addEventListener('touchmove', e => { if (gameOver) return; e.preventDefault(); aimX = pointerX(e); clampAim(); }, { passive: false });
canvas.addEventListener('mousedown', e => { if (gameOver) return; aimX = pointerX(e); clampAim(); dropFruit(); });
canvas.addEventListener('touchstart', e => { if (gameOver) return; e.preventDefault(); aimX = pointerX(e); clampAim(); }, { passive: false });
canvas.addEventListener('touchend', e => { if (gameOver) return; e.preventDefault(); dropFruit(); }, { passive: false });
canvas.addEventListener('touchcancel', () => {}, { passive: true });

window.addEventListener('keydown', e => {
  if (gameOver) { if (e.code === 'Space' || e.code === 'Enter') restart(); return; }
  if (e.code === 'ArrowLeft')  { aimX -= 18; clampAim(); }
  if (e.code === 'ArrowRight') { aimX += 18; clampAim(); }
  if (e.code === 'Space' || e.code === 'ArrowDown') { e.preventDefault(); dropFruit(); }
});

/* ==================== 投放 ==================== */
function dropFruit() {
  if (!canDrop || gameOver) return;
  canDrop = false; dropCooldown = 24;   // ~0.4s 后可再次投放
  const f = makeFruit(currentLevel, aimX, SPAWN_Y, 0, 3);
  fruits.push(f);
  currentLevel = nextLevel;
  nextLevel = randSpawnLevel();
  $next.textContent = FRUITS[nextLevel].emoji;
}

/* ==================== 合成 ==================== */
function merge(a, b) {
  const nl = a.level + 1;
  const m1 = a.r * a.r, m2 = b.r * b.r, tm = m1 + m2;
  const x = (a.x * m1 + b.x * m2) / tm;
  const y = (a.y * m1 + b.y * m2) / tm;
  const f = makeFruit(nl, x, y,
    (a.vx * m1 + b.vx * m2) / tm * 0.5,
    (a.vy * m1 + b.vy * m2) / tm * 0.5 - 1.2);
  f.pop = 1;
  fruits.push(f);

  const pts = FRUITS[nl].score;
  score += pts;
  $score.textContent = score;
  if (score > best) { best = score; $best.textContent = best; localStorage.setItem('dw_best', best); }

  const col = COLORS[nl];
  for (let i = 0; i < 14; i++) {
    const ang = rand(0, Math.PI * 2), sp = rand(1.5, 5);
    particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1,
                     life: 1, col, r: rand(2, 5) });
  }
  popups.push({ x, y: y - FRUITS[nl].r * 0.4, txt: '+' + pts, life: 1 });
  playPop(nl);

  if (nl === MAX_LEVEL) {
    winFlash = 40;
    popups.push({ x: W / 2, y: H / 2 - 60, txt: '🍉 合成大西瓜！', life: 1.6, big: true });
  }
}

/* ==================== 物理引擎 ==================== */
const GRAVITY = 0.42, REST = 0.18, AIR = 0.996, FLOOR_FRICTION = 0.94;
const ITER = 6, MAX_V = 16;

function physics() {
  for (const f of fruits) {
    f.age++;
    f.vy += GRAVITY;
    f.vx *= AIR; f.vy *= AIR;
    const v = Math.hypot(f.vx, f.vy);
    if (v > MAX_V) { f.vx *= MAX_V / v; f.vy *= MAX_V / v; }
    f.x += f.vx; f.y += f.vy;
    if (f.pop > 0) f.pop = Math.max(0, f.pop - 0.06);
  }

  for (const f of fruits) {
    if (f.x - f.r < WALL_L) { f.x = WALL_L + f.r; if (f.vx < 0) f.vx *= -0.4; }
    if (f.x + f.r > WALL_R) { f.x = WALL_R - f.r; if (f.vx > 0) f.vx *= -0.4; }
    if (f.y + f.r > FLOOR) {
      f.y = FLOOR - f.r;
      if (f.vy > 0) f.vy *= -0.3;
      f.vx *= FLOOR_FRICTION;
      if (Math.abs(f.vy) < 0.6) f.vy = 0;
    }
  }

  for (let it = 0; it < ITER; it++) {
    const n = fruits.length;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = fruits[i], b = fruits[j];
        if (!fruits.includes(a) || !fruits.includes(b)) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        if (d === 0) { dx = 0.01; dy = 0; d = 0.01; }
        const minD = a.r + b.r;
        if (d >= minD) continue;

        if (it === 0 && a.level === b.level && a.level < MAX_LEVEL && d < minD) {
          const idxA = fruits.indexOf(a), idxB = fruits.indexOf(b);
          fruits.splice(Math.max(idxA, idxB), 1);
          fruits.splice(Math.min(idxA, idxB), 1);
          merge(a, b);
          j = n;
          continue;
        }

        const nx = dx / d, ny = dy / d;
        const m1 = a.r * a.r, m2 = b.r * b.r, tm = m1 + m2;
        const overlap = minD - d;
        const corr = overlap * 0.55;
        a.x -= nx * corr * (m2 / tm); a.y -= ny * corr * (m2 / tm);
        b.x += nx * corr * (m1 / tm); b.y += ny * corr * (m1 / tm);
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const jj = -(1 + REST) * vn / (1 / m1 + 1 / m2);
          a.vx -= jj / m1 * nx; a.vy -= jj / m1 * ny;
          b.vx += jj / m2 * nx; b.vy += jj / m2 * ny;
          const tx = -ny, ty = nx;
          const vt = rvx * tx + rvy * ty;
          const jt = -vt * 0.08 / (1 / m1 + 1 / m2);
          a.vx -= jt / m1 * tx; a.vy -= jt / m1 * ty;
          b.vx += jt / m2 * tx; b.vy += jt / m2 * ty;
        }
      }
    }
  }

  if (!gameOver) {
    for (const f of fruits) {
      if (f.age < 50) continue;
      if (f.y - f.r < DANGER_Y && Math.abs(f.vy) < 3 && f.y < FLOOR - f.r - 1) {
        f.overT++;
        if (f.overT > 80) { endGame(); return; }
      } else if (f.y - f.r < DANGER_Y - 40) {
        f.overT += 3;
        if (f.overT > 90) { endGame(); return; }
      } else {
        f.overT = Math.max(0, f.overT - 2);
      }
    }
  }
}

function endGame() {
  gameOver = true;
  $finalScore.textContent = score;
  const maxLv = fruits.reduce((m, f) => Math.max(m, f.level), 0);
  $finalFruit.textContent = `本局最大水果：${FRUITS[maxLv].emoji} ${FRUITS[maxLv].name}`;
  $overlay.classList.add('show');
}

function restart() {
  fruits = []; particles = []; popups = [];
  score = 0; gameOver = false; winFlash = 0;
  canDrop = true; dropCooldown = 0;
  currentLevel = randSpawnLevel(); nextLevel = randSpawnLevel();
  $next.textContent = FRUITS[nextLevel].emoji;
  $score.textContent = 0;
  $overlay.classList.remove('show');
}
document.getElementById('restart').addEventListener('click', restart);

/* ==================== 渲染 ==================== */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return `rgb(${r},${g},${b})`;
}

function drawFruitBody(x, y, r, level, pop) {
  const scale = pop > 0 ? 1 + pop * 0.35 : 1;
  const rr = r * scale;
  ctx.save();
  ctx.beginPath();
  ctx.arc(x + 2, y + 4, rr, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fill();
  const g = ctx.createRadialGradient(x - rr * 0.35, y - rr * 0.4, rr * 0.1, x, y, rr);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.18, COLORS[level]);
  g.addColorStop(1, shade(COLORS[level], -35));
  ctx.beginPath();
  ctx.arc(x, y, rr, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = shade(COLORS[level], -55);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(x - rr * 0.35, y - rr * 0.42, rr * 0.22, rr * 0.13, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fill();
  ctx.font = `${Math.round(rr * 1.25)}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(FRUITS[level].emoji, x, y + rr * 0.06);
  ctx.restore();
}

function render() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#20416e');
  bg.addColorStop(1, '#152744');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,.03)';
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.arc(60 + i * 68, 180 + (i % 3) * 160, 40, 0, Math.PI * 2);
    ctx.fill();
  }

  if (winFlash > 0) {
    ctx.fillStyle = `rgba(255,215,0,${winFlash / 40 * 0.18})`;
    ctx.fillRect(0, 0, W, H);
    winFlash--;
  }

  ctx.save();
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = 'rgba(255,90,90,.75)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,90,90,.85)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('⚠ 警戒线', W - 8, DANGER_Y - 4);
  ctx.restore();

  if (!gameOver && canDrop) {
    const r = FRUITS[currentLevel].r;
    ctx.save();
    ctx.setLineDash([4, 10]);
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(aimX, SPAWN_Y + r); ctx.lineTo(aimX, FLOOR); ctx.stroke();
    ctx.restore();
    drawFruitBody(aimX, SPAWN_Y, r, currentLevel, 0);
  }

  for (const f of fruits) drawFruitBody(f.x, f.y, f.r, f.level, f.pop);

  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.col;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.font = (p.big ? 'bold 30px' : 'bold 18px') + ' sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 4;
    ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = p.big ? '#ffd166' : '#fff';
    ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

/* ==================== 主循环 ==================== */
function update() {
  if (!gameOver) {
    if (!canDrop) {
      dropCooldown--;
      if (dropCooldown <= 0) canDrop = true;
    }
    physics();
  }
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.03;
  }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 0.8; p.life -= 0.02; }
  popups = popups.filter(p => p.life > 0);

  render();
  requestAnimationFrame(update);
}

/* ==================== 自适应尺寸监听 ==================== */
fitCanvas();
window.addEventListener('resize', fitCanvas, { passive: true });
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 180));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas, { passive: true });
if (window.ResizeObserver) new ResizeObserver(() => fitCanvas()).observe(stageWrap);

/* ==================== 启动 ==================== */
$best.textContent = best;
currentLevel = randSpawnLevel();
nextLevel = randSpawnLevel();
$next.textContent = FRUITS[nextLevel].emoji;
update();

})();
</script>
</body>
</html>
