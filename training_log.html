<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>运动记录 · TRAINING LOG</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel-2:#1c2230;
    --line:#2a3140;
    --line-soft:#212836;
    --ink:#e6edf3;
    --ink-2:#9aa7b8;
    --ink-3:#6b7688;
    --up:#ff5c5c;          /* 涨 → 红 */
    --down:#3fb950;
    --accent:#58a6ff;
    --accent-2:#7ee787;
    --warn:#d29922;
    --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;
    padding:0 0 48px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px;}

  /* ---------- 顶栏 ---------- */
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px 0 18px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand b{font-size:19px;letter-spacing:.5px;}
  .brand span{font-size:10.5px;letter-spacing:2.4px;color:var(--ink-3);text-transform:uppercase;}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
    padding:8px 14px;border-radius:9px;font-size:12.5px;cursor:pointer;
    transition:.16s;font-family:inherit;
  }
  .btn:hover{background:var(--panel-2);color:var(--ink);border-color:#39424f;}
  .btn.primary{
    background:linear-gradient(135deg,#1f6feb,#388bfd);border-color:transparent;color:#fff;font-weight:600;
  }
  .btn.primary:hover{filter:brightness(1.1);}

  /* ---------- 概览卡 ---------- */
  .overview{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;
  }
  .ov{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
    padding:15px 16px;
  }
  .ov .k{font-size:11px;letter-spacing:1.2px;color:var(--ink-3);text-transform:uppercase;}
  .ov .v{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:5px;line-height:1.15;font-variant-numeric:tabular-nums;}
  .ov .d{font-size:11.5px;color:var(--ink-3);margin-top:2px;}

  /* ---------- 区块 ---------- */
  .sec{margin-bottom:26px;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:13px;flex-wrap:wrap;}
  .sec-title{font-size:16.5px;font-weight:650;display:flex;align-items:center;gap:9px;}
  .sec-title::before{content:'';width:3px;height:15px;border-radius:2px;background:var(--accent);}
  .sec-hint{font-size:11.5px;color:var(--ink-3);}

  /* ---------- 打卡区 ---------- */
  .today-card{
    background:linear-gradient(180deg,#171d26,#141920);
    border:1px solid var(--line-soft);border-radius:18px;padding:20px;
  }
  .today-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding-bottom:16px;border-bottom:1px solid var(--line-soft);margin-bottom:16px;flex-wrap:wrap;
  }
  .today-date{font-size:15px;font-weight:600;}
  .today-date small{color:var(--ink-3);font-weight:400;margin-left:8px;font-size:12px;}
  .streak{
    display:inline-flex;align-items:center;gap:7px;background:rgba(255,92,92,.1);
    border:1px solid rgba(255,92,92,.25);color:#ff8f8f;
    padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
  }
  .checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
  .item{
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;transition:.18s;
  }
  .item.done{border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.06);}
  .item-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
  .item-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .item-goal{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{
    width:34px;height:34px;flex:0 0 auto;border-radius:9px;border:1px solid var(--line);
    background:#0f141b;color:var(--ink-2);font-size:17px;line-height:1;cursor:pointer;
    display:grid;place-items:center;transition:.14s;font-family:inherit;
  }
  .stepper button:hover{background:#1b2431;color:var(--ink);border-color:#39424f;}
  .stepper button:active{transform:scale(.94);}
  .stepper input{
    flex:1;min-width:0;width:100%;text-align:center;background:#0d131a;
    border:1px solid var(--line);border-radius:9px;color:var(--ink);
    font-size:17px;font-weight:700;padding:7px 4px;font-family:inherit;
    font-variant-numeric:tabular-nums;outline:none;transition:.15s;
  }
  .stepper input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.13);}
  .item-state{font-size:11.5px;margin-top:9px;display:flex;align-items:center;gap:6px;min-height:17px;}
  .item-state .ok{color:#4dd06a;}
  .item-state .pct{color:var(--ink-3);}

  /* ---------- 图表 ---------- */
  .chart-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .chart-card{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
    padding:17px 17px 13px;
  }
  .chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;}
  .chart-title{font-size:14px;font-weight:620;display:flex;align-items:center;gap:8px;}
  .chart-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px;}
  .delta{
    font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .delta.up{color:#ff8f8f;background:rgba(255,92,92,.1);}
  .delta.down{color:#6ee787;background:rgba(63,185,80,.1);}
  .delta.flat{color:var(--ink-3);background:rgba(255,255,255,.05);}
  /* 月度对比行：本月均值 vs 上月均值 */
  .chart-stat{
    font-size:11.5px;color:var(--ink-3);margin-top:7px;
    font-variant-numeric:tabular-nums;min-height:17px;
  }
  .chart-stat em{font-style:normal;color:var(--ink-2);font-weight:600;}
  .chart-stat .arrow{color:#4b5666;margin:0 5px;}
  .chart-box{position:relative;width:100%;height:186px;margin-top:8px;}
  .chart-box canvas{width:100%;height:100%;display:block;cursor:crosshair;}
  .chart-empty{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    color:var(--ink-3);font-size:12.5px;line-height:1.9;
  }
  .axis-note{font-size:10.5px;color:var(--ink-3);margin-top:9px;display:flex;justify-content:space-between;}

  /* ---------- 历史表 ---------- */
  .table-wrap{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;}
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:660px;}
  th,td{padding:11px 13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;}
  thead th{
    font-size:11px;letter-spacing:.8px;color:var(--ink-3);font-weight:600;
    text-transform:uppercase;border-bottom:1px solid var(--line);background:#131922;
  }
  thead th:first-child{background:#131922;}
  tbody tr{border-bottom:1px solid var(--line-soft);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover td{background:#1a212c;}
  tbody tr:hover td:first-child{background:#1a212c;}
  tbody tr.today td{background:rgba(88,166,255,.07);}
  tbody tr.today td:first-child{background:rgba(88,166,255,.07);}
  td .miss{color:var(--ink-3);}
  td .hit{color:#6ee787;font-weight:600;}
  .row-del{
    border:none;background:transparent;color:var(--ink-3);cursor:pointer;
    font-size:15px;line-height:1;padding:3px 5px;border-radius:6px;font-family:inherit;
  }
  .row-del:hover{color:#ff8f8f;background:rgba(255,92,92,.1);}
  .empty-row td{text-align:center;color:var(--ink-3);padding:34px 13px;}
  .weekday{color:var(--ink-3);font-size:11.5px;margin-left:7px;}

  /* ---------- 页脚 ---------- */
  .foot{
    text-align:center;color:var(--ink-3);font-size:11.5px;
    margin-top:30px;line-height:2;
  }
  .foot b{color:var(--ink-2);font-weight:600;}

  /* ---------- 提示条 ---------- */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,26px);
    background:#1f6feb;color:#fff;padding:11px 22px;border-radius:11px;
    font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
    transition:.28s cubic-bezier(.2,.8,.3,1);z-index:99;
    box-shadow:0 12px 32px -8px rgba(0,0,0,.6);max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- 响应式 ---------- */
  @media (max-width:980px){
    .chart-grid{grid-template-columns:1fr;}
  }
  @media (max-width:760px){
    .wrap{padding:0 14px;}
    .overview{grid-template-columns:repeat(2,1fr);gap:10px;}
    .ov .v{font-size:22px;}
    .checklist{grid-template-columns:1fr;}
    .top{padding:16px 0 14px;}
    .today-card{padding:16px;border-radius:16px;}
    .chart-card{padding:15px 14px 11px;}
    .chart-box{height:172px;}
  }
  @media (max-width:420px){
    .brand b{font-size:17px;}
    .brand span{display:none;}
    .btn{padding:7px 11px;font-size:12px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><b>运动记录</b><span>Training Log</span></div>
    <div class="top-actions">
      <button class="btn" id="btn-export">导出备份</button>
      <button class="btn" id="btn-import">导入</button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
      <button class="btn" id="btn-demo">示例数据</button>
      <button class="btn" id="btn-clear">清空</button>
    </div>
  </div>

  <!-- 概览 -->
  <div class="overview">
    <div class="ov"><div class="k">连续打卡</div><div class="v" id="ov-streak">0</div><div class="d">天</div></div>
    <div class="ov"><div class="k">本月训练</div><div class="v" id="ov-month">0</div><div class="d" id="ov-month-d">次 · 每天最多计 1 次</div></div>
    <div class="ov"><div class="k">累计训练</div><div class="v" id="ov-total">0</div><div class="d">次</div></div>
    <div class="ov"><div class="k">全部达成</div><div class="v" id="ov-perfect">0</div><div class="d">天 · 四项全达标</div></div>
  </div>

  <!-- 今日打卡 -->
  <div class="sec">
    <div class="sec-head">
      <div class="sec-title">今日打卡</div>
      <div class="sec-hint">填实际完成数量 · 自动保存</div>
    </div>
    <div class="today-card">
      <div class="today-head">
        <div class="today-date" id="today-label">—</div>
        <div class="streak" id="streak-badge">🔥 连续 0 天</div>
      </div>
      <div class="checklist" id="checklist"></div>
    </div>
  </div>

  <!-- 趋势 -->
  <div class="sec">
    <div class="sec-head">
      <div class="sec-title">趋势变化</div>
      <div class="sec-hint" id="trend-range">—</div>
    </div>
    <div class="chart-grid" id="chart-grid"></div>
  </div>

  <!-- 历史 -->
  <div class="sec">
    <div class="sec-head">
      <div class="sec-title">历史记录</div>
      <div class="sec-hint">点击行内 × 可删除该天记录</div>
    </div>
    <div class="table-wrap">
      <div class="tbl-scroll">
        <table>
          <thead id="tbl-head"></thead>
          <tbody id="tbl-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="foot">
    数据保存在本机浏览器 <b>localStorage</b> 中，不上传任何服务器<br>
    建议定期点击「导出备份」保存 JSON 文件，换设备时用「导入」还原
  </div>

</div>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ==================== 运动项目定义 ==================== */
const EXERCISES = [
  { id:'dumbbell', name:'哑铃',       icon:'🏋️', sets:4, reps:15, unit:'个', target:60, color:'#58a6ff' },
  { id:'clap',     name:'胯下击掌',   icon:'👏', sets:3, reps:50, unit:'个', target:150, color:'#7ee787' },
  { id:'squat',    name:'深蹲',       icon:'🦵', sets:1, reps:20, unit:'个', target:20, color:'#f0883e' },
  { id:'pushup',   name:'握拳俯卧撑', icon:'💪', sets:1, reps:10, unit:'个', target:10, color:'#d2a8ff' },
];
const KEY = 'training_log_v1';

/* ==================== 数据层 ==================== */
let store = {};        // { 'YYYY-MM-DD': { dumbbell:60, clap:150, ... } }

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    store = raw ? JSON.parse(raw) : {};
    if (typeof store !== 'object' || store === null || Array.isArray(store)) store = {};
  } catch (e) { store = {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch (e) { toast('保存失败：浏览器存储空间不足或被禁用'); }
}
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => ymd(new Date());

function getDay(k) { return store[k] || {}; }
function setVal(k, id, v) {
  const d = getDay(k);
  if (v > 0) d[id] = v; else delete d[id];
  if (Object.keys(d).length === 0) delete store[k]; else store[k] = d;
  save();
}
function hasAny(k) { const d = store[k]; return !!d && EXERCISES.some(e => (d[e.id] || 0) > 0); }
function perfect(k) {
  const d = store[k];
  return !!d && EXERCISES.every(e => (d[e.id] || 0) >= e.target);
}
function sortKeysDesc() { return Object.keys(store).filter(hasAny).sort().reverse(); }

/* 连续打卡：从今天（或昨天）往前数 */
function streak() {
  const d = new Date();
  if (!hasAny(ymd(d))) d.setDate(d.getDate() - 1);   // 今天还没练，从昨天算起
  let n = 0;
  while (hasAny(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* 某项目的趋势序列（按日期升序） */
function series(id, sinceDays) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - sinceDays);
  const ck = ymd(cutoff);
  return sortKeysDesc()
    .filter(k => k >= ck && (getDay(k)[id] || 0) > 0)
    .map(k => ({ date: k, value: getDay(k)[id] }))
    .reverse();
}

/* ==================== 提示 ==================== */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ==================== 渲染：今日打卡 ==================== */
function renderToday() {
  const k = todayKey();
  const d = new Date();
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('today-label').innerHTML =
    `${k.replace(/-/g,' / ')}<small>${wd}</small>`;

  const box = document.getElementById('checklist');
  box.innerHTML = '';
  EXERCISES.forEach(ex => {
    const val = getDay(k)[ex.id] || 0;
    const done = val >= ex.target;
    const el = document.createElement('div');
    el.className = 'item' + (done ? ' done' : '');
    el.innerHTML = `
      <div class="item-top">
        <div class="item-name"><span class="dot" style="background:${ex.color}"></span>${ex.icon} ${ex.name}</div>
        <div class="item-goal">目标 ${ex.sets} 组 × ${ex.reps} = ${ex.target}${ex.unit}</div>
      </div>
      <div class="stepper">
        <button data-act="minus" data-id="${ex.id}" aria-label="减少">−</button>
        <input type="text" inputmode="numeric" pattern="[0-9]*"
               data-id="${ex.id}" value="${val > 0 ? val : ''}"
               placeholder="0" aria-label="${ex.name}完成数量">
        <button data-act="plus" data-id="${ex.id}" aria-label="增加">+</button>
      </div>
      <div class="item-state">${
        val > 0
          ? (done ? `<span class="ok">✓ 已达成目标</span>`
                  : `<span class="pct">完成 ${Math.round(val / ex.target * 100)}% · 还差 ${ex.target - val}${ex.unit}</span>`)
          : `<span class="pct">未记录</span>`
      }</div>`;
    box.appendChild(el);
  });

  const s = streak();
  document.getElementById('streak-badge').textContent = `🔥 连续 ${s} 天`;
}

/* 步进 / 输入事件（事件委托） */
document.getElementById('checklist').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  const ex = EXERCISES.find(x => x.id === id);
  const step = ex.target >= 100 ? 10 : (ex.target >= 50 ? 5 : 5);
  const k = todayKey();
  let v = getDay(k)[id] || 0;
  v = btn.dataset.act === 'plus' ? v + step : Math.max(0, v - step);
  setVal(k, id, v);
  renderToday(); renderOverview(); renderAll();
});
document.getElementById('checklist').addEventListener('input', e => {
  const inp = e.target.closest('input[data-id]');
  if (!inp) return;
  const digits = inp.value.replace(/\D/g, '').slice(0, 4);
  if (digits !== inp.value) inp.value = digits;
  setVal(todayKey(), inp.dataset.id, digits ? parseInt(digits, 10) : 0);
});
document.getElementById('checklist').addEventListener('blur', e => {
  const inp = e.target.closest('input[data-id]');
  if (!inp) return;
  renderToday(); renderOverview(); renderAll();
}, true);

/* ==================== 渲染：概览 ==================== */
function renderOverview() {
  const keys = sortKeysDesc();
  const now = new Date();
  const prefix = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-`;
  document.getElementById('ov-streak').textContent = streak();
  document.getElementById('ov-month').textContent = keys.filter(k => k.startsWith(prefix)).length;
  document.getElementById('ov-total').textContent = keys.length;
  document.getElementById('ov-perfect').textContent = keys.filter(perfect).length;
}

/* ==================== 图表绘制（Canvas 折线图） ==================== */
const charts = [];

function setupCanvas(cv) {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = cv.clientWidth || 300, h = cv.clientHeight || 180;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function niceTicks(min, max, count) {
  if (min === max) { min = Math.max(0, min - 5); max = max + 5; }
  const span = max - min;
  const rawStep = span / (count - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * .5; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}

function drawChart(chart) {
  const { cv, ex, data } = chart;
  const { ctx, w, h } = setupCanvas(cv);
  ctx.clearRect(0, 0, w, h);

  const padL = 40, padR = 12, padT = 12, padB = 26;
  const iw = w - padL - padR, ih = h - padT - padB;

  if (data.length === 0) {
    chart.empty.style.display = 'grid';
    chart.empty.innerHTML = `还没有${ex.name}的记录<br>今天练完在上面填一下就有曲线了`;
    return;
  }
  chart.empty.style.display = 'none';

  const vals = data.map(d => d.value);
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4);
  const yMin = ticks[0], yMax = ticks[ticks.length - 1];
  const X = i => data.length === 1 ? padL + iw / 2
             : padL + (iw * i) / (data.length - 1);
  const Y = v => padT + ih - (ih * (v - yMin)) / (yMax - yMin || 1);

  /* 网格 + Y 轴刻度 */
  ctx.font = '10.5px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ticks.forEach(t => {
    const y = Y(t);
    ctx.beginPath();
    ctx.moveTo(padL, y); ctx.lineTo(w - padR, y);
    ctx.strokeStyle = (t === 0) ? '#39424f' : '#212836';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#6b7688';
    ctx.fillText(String(t), padL - 8, y);
  });

  /* 目标线 */
  if (ex.target >= yMin && ex.target <= yMax) {
    const ty = Y(ex.target);
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(210,153,34,.85)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(padL, ty); ctx.lineTo(w - padR, ty); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(210,153,34,.9)';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('目标 ' + ex.target, padL + 4, ty - 3);
  }

  /* X 轴日期 */
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#6b7688';
  const maxLbl = w < 380 ? 3 : 5;
  const stride = Math.max(1, Math.ceil(data.length / maxLbl));
  data.forEach((d, i) => {
    if (i % stride !== 0 && i !== data.length - 1) return;
    const lbl = d.date.slice(5).replace('-', '/');
    ctx.fillText(lbl, X(i), padT + ih + 8);
  });

  /* 面积填充 */
  if (data.length > 1) {
    const grad = ctx.createLinearGradient(0, padT, 0, padT + ih);
    grad.addColorStop(0, hexA(ex.color, .30));
    grad.addColorStop(1, hexA(ex.color, .02));
    ctx.beginPath();
    ctx.moveTo(X(0), padT + ih);
    data.forEach((d, i) => ctx.lineTo(X(i), Y(d.value)));
    ctx.lineTo(X(data.length - 1), padT + ih);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
  }

  /* 折线 */
  ctx.beginPath();
  data.forEach((d, i) => i === 0 ? ctx.moveTo(X(i), Y(d.value)) : ctx.lineTo(X(i), Y(d.value)));
  ctx.strokeStyle = ex.color;
  ctx.lineWidth = 2.4;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();

  /* 数据点 */
  data.forEach((d, i) => {
    const x = X(i), y = Y(d.value);
    ctx.beginPath(); ctx.arc(x, y, 4.2, 0, Math.PI * 2);
    ctx.fillStyle = '#0d1117'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 4.2, 0, Math.PI * 2);
    ctx.strokeStyle = ex.color; ctx.lineWidth = 2.2; ctx.stroke();
    if (i === data.length - 1) {           // 最新点实心高亮
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = ex.color; ctx.fill();
    }
  });

  /* 最新值标注 */
  const last = data[data.length - 1];
  const lx = X(data.length - 1), ly = Y(last.value);
  ctx.font = 'bold 12px -apple-system,"PingFang SC",sans-serif';
  const tw = ctx.measureText(String(last.value)).width;
  let bx = lx + 9; if (bx + tw + 12 > w - padR) bx = lx - tw - 21;
  ctx.fillStyle = ex.color;
  roundRect(ctx, bx, ly - 11, tw + 12, 21, 6);
  ctx.fill();
  ctx.fillStyle = '#0d1117';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(String(last.value), bx + 6, ly + 1);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

/* ==================== 图表卡片渲染 ==================== */
const RANGE_DAYS = 90;

function buildCharts() {
  const grid = document.getElementById('chart-grid');
  grid.innerHTML = '';
  charts.length = 0;

  EXERCISES.forEach(ex => {
    const card = document.createElement('div');
    card.className = 'chart-card';
    card.innerHTML = `
      <div class="chart-head">
        <div>
          <div class="chart-title"><span class="dot" style="background:${ex.color}"></span>${ex.icon} ${ex.name}</div>
          <div class="chart-sub">目标 ${ex.target}${ex.unit} · 实际完成趋势</div>
        </div>
        <div class="delta flat" data-delta="${ex.id}">—</div>
      </div>
      <div class="chart-stat">
        <span data-cmp="${ex.id}"></span>
      </div>
      <div class="chart-box">
        <canvas data-chart="${ex.id}"></canvas>
        <div class="chart-empty"></div>
      </div>
      <div class="axis-note"><span>近 ${RANGE_DAYS} 天</span><span data-count="${ex.id}"></span></div>`;
    grid.appendChild(card);

    const chart = {
      ex,
      cv: card.querySelector('canvas'),
      empty: card.querySelector('.chart-empty'),
      deltaEl: card.querySelector(`[data-delta="${ex.id}"]`),
      cmpEl: card.querySelector(`[data-cmp="${ex.id}"]`),
      countEl: card.querySelector(`[data-count="${ex.id}"]`),
      data: []
    };
    charts.push(chart);
  });
}

/* 按月聚合：当前月 vs 上一个有记录的月（更贴近「这个月 vs 下个月」的直觉） */
function monthlyCompare(id) {
  const byMonth = {};
  sortKeysDesc().forEach(k => {
    const m = k.slice(0, 7);
    const v = getDay(k)[id] || 0;
    if (v > 0) (byMonth[m] = byMonth[m] || []).push(v);
  });
  const months = Object.keys(byMonth).sort();
  if (months.length === 0) return null;
  const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
  const peak = a => Math.max(...a);
  const curM = months[months.length - 1];
  const res = {
    curMonth: curM, curAvg: avg(byMonth[curM]), curPeak: peak(byMonth[curM]), curDays: byMonth[curM].length,
    prevMonth: null, prevAvg: null, prevPeak: null
  };
  if (months.length > 1) {
    const p = months[months.length - 2];
    res.prevMonth = p; res.prevAvg = avg(byMonth[p]); res.prevPeak = peak(byMonth[p]);
  }
  return res;
}

/* 趋势徽标：本月均值 vs 上月均值（辅助显示峰值变化） */
function updateDelta(chart) {
  const el = chart.deltaEl;
  const ex = chart.ex, u = ex.unit;
  el.className = 'delta';
  const mc = monthlyCompare(ex.id);
  if (!mc) { el.classList.add('flat'); el.textContent = '暂无数据'; return; }
  if (mc.prevAvg === null) {
    el.classList.add('flat');
    el.textContent = `本月均值 ${Math.round(mc.curAvg)}${u}`;
    return;
  }
  const diff = mc.curAvg - mc.prevAvg;
  const pct = Math.round(Math.abs(diff) / mc.prevAvg * 100);
  const pd = mc.curPeak - mc.prevPeak;
  if (diff > 0) { el.classList.add('up');   el.textContent = `▲ +${pct}% 较上月`; }
  else if (diff < 0) { el.classList.add('down'); el.textContent = `▼ -${pct}% 较上月`; }
  else { el.classList.add('flat'); el.textContent = '与上月持平'; }
  // 峰值提升时补充提示
  if (pd > 0) el.textContent += ` · 峰值+${pd}`;
}

/* 月度对比文案：本月均值 → 上月均值 */
function updateCmp(chart) {
  const el = chart.cmpEl, ex = chart.ex, u = ex.unit;
  const mc = monthlyCompare(ex.id);
  if (!mc) { el.innerHTML = ''; return; }
  const curM = mc.curMonth.slice(5).replace('-', '月') + '月';
  const cur = `<em>${Math.round(mc.curAvg)}${u}</em>`;
  if (mc.prevAvg === null) {
    el.innerHTML = `${curM}均值 ${cur} · 共 ${mc.curDays} 天`;
    return;
  }
  const prevM = mc.prevMonth.slice(5).replace('-', '月') + '月';
  const prev = `<em>${Math.round(mc.prevAvg)}${u}</em>`;
  el.innerHTML = `${prevM} ${prev}<span class="arrow">→</span>${curM} ${cur} · 本月 ${mc.curDays} 天`;
}

function renderCharts() {
  charts.forEach(c => {
    c.data = series(c.ex.id, RANGE_DAYS);
    c.countEl.textContent = c.data.length ? `${c.data.length} 次记录` : '';
    updateDelta(c);
    updateCmp(c);
    drawChart(c);
  });
  const all = charts.reduce((m, c) => Math.max(m, c.data.length), 0);
  document.getElementById('trend-range').textContent = all
    ? `近 ${RANGE_DAYS} 天 · 趋势看长期变化` : `近 ${RANGE_DAYS} 天`;
}

/* ==================== 历史表 ==================== */
function renderTable() {
  const keys = sortKeysDesc();
  const head = document.getElementById('tbl-head');
  const body = document.getElementById('tbl-body');
  const wdArr = ['周日','周一','周二','周三','周四','周五','周六'];

  head.innerHTML = `<tr><th>日期</th>${EXERCISES.map(e => `<th>${e.name}</th>`).join('')}<th></th></tr>`;

  if (keys.length === 0) {
    body.innerHTML = `<tr class="empty-row"><td colspan="${EXERCISES.length + 2}">还没有任何记录<br>在上面填写今天的完成数量即可开始</td></tr>`;
    return;
  }

  const tk = todayKey();
  body.innerHTML = keys.map(k => {
    const d = store[k] || {};
    const wd = wdArr[new Date(k + 'T00:00:00').getDay()];
    const cells = EXERCISES.map(e => {
      const v = d[e.id] || 0;
      if (v <= 0) return `<td><span class="miss">—</span></td>`;
      const hit = v >= e.target;
      return `<td class="${hit ? 'hit' : ''}">${v}${e.unit}${hit ? ' ✓' : ''}</td>`;
    }).join('');
    return `<tr class="${k === tk ? 'today' : ''}">
      <td>${k.slice(5).replace('-', '/')}<span class="weekday">${wd}</span></td>
      ${cells}
      <td><button class="row-del" data-del="${k}" title="删除该天记录">×</button></td>
    </tr>`;
  }).join('');
}

document.getElementById('tbl-body').addEventListener('click', e => {
  const btn = e.target.closest('button[data-del]');
  if (!btn) return;
  const k = btn.dataset.del;
  if (!confirm(`确定删除 ${k} 的记录吗？`)) return;
  delete store[k];
  save();
  renderOverview(); renderToday(); renderAll();
  toast('已删除 ' + k);
});

/* ==================== 导入 / 导出 / 示例 ==================== */
document.getElementById('btn-export').addEventListener('click', () => {
  if (Object.keys(store).length === 0) { toast('还没有数据可导出'); return; }
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `training-log-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('备份已导出');
});

document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      if (typeof obj !== 'object' || obj === null || Array.isArray(obj)) throw new Error('格式错误');
      const merged = { ...store, ...obj };
      store = merged; save();
      renderAll(); renderOverview(); renderToday();
      toast('导入成功，共 ' + sortKeysDesc().length + ' 天记录');
    } catch (err) { toast('导入失败：JSON 格式不正确'); }
  };
  rd.readAsText(f);
  e.target.value = '';
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (Object.keys(store).length === 0) { toast('已经是空的了'); return; }
  if (!confirm('确定清空全部训练记录吗？此操作不可恢复。\n建议先「导出备份」。')) return;
  store = {}; save();
  renderAll(); renderOverview(); renderToday();
  toast('已清空全部记录');
});

/* 示例数据：近 60 天渐进曲线，覆盖当前月与上一个完整月，便于预览趋势 */
document.getElementById('btn-demo').addEventListener('click', () => {
  if (Object.keys(store).length > 0 &&
      !confirm('将用一段示例数据覆盖近期记录（用于预览趋势），继续吗？')) return;
  store = {};                                          // 干净重来，避免与旧示例叠加
  const rnd = (a, b) => a + Math.random() * (b - a);
  const DAYS = 60;
  const base = { dumbbell:60, clap:150, squat:20, pushup:10 };
  let made = 0;
  for (let i = DAYS - 1; i >= 0; i--) {
    const d = new Date(); d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - i);
    if (Math.random() < 0.13) continue;                // 偶尔休息一天
    const k = ymd(d);
    const prog = (DAYS - 1 - i) / (DAYS - 1);          // 0 → 1 渐进
    const rec = {};
    EXERCISES.forEach(ex => {
      const step = ex.target <= 20 ? 1 : 5;             // 小组数按 1 递增，避免取整丢失
      const grow = ex.id === 'pushup' ? 1 + prog * 1.1  // 握拳俯卧撑 10 → 21，增长最明显
                 : ex.id === 'squat'  ? 1 + prog * 0.5
                 : ex.id === 'clap'   ? 1 + prog * 0.3
                 : 1 + prog * 0.25;
      let v = base[ex.id] * grow * rnd(0.94, 1.06);
      v = Math.max(step, Math.round(v / step) * step);
      rec[ex.id] = v;
    });
    store[k] = rec; made++;
  }
  save(); renderAll(); renderOverview(); renderToday();
  toast(`示例数据已生成（${made} 天）`);
});

/* ==================== 总调度 ==================== */
function renderAll() { renderCharts(); renderTable(); }

function refreshAll() { renderToday(); renderOverview(); renderAll(); }

/* 窗口尺寸变化重绘图表 */
let rzTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => renderCharts(), 160);
});

/* ==================== 启动 ==================== */
load();
buildCharts();
refreshAll();
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(() => renderCharts(), 160);
  }).observe(document.getElementById('chart-grid'));
}

})();
</script>
